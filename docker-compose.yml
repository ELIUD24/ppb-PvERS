services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: "${DB_USER:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-hatua.}"
      DB_NAME: "${DB_NAME:-pvers}"
      APP_FULL_BASE_URL: http://localhost:8080
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:5.7.42
    platform: linux/amd64
    ports:
      - "${DB_FORWARD_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-hatua.}"
      MYSQL_DATABASE: "${DB_NAME:-pvers}"
    volumes:
      - db_data:/var/lib/mysql
      - ./staging_pvers.sql:/docker-entrypoint-initdb.d/01-staging_pvers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    platform: linux/amd64
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: "${DB_USER:-root}"
      PMA_PASSWORD: "${DB_PASSWORD:-hatua.}"
    restart: unless-stopped

volumes:
  db_data:
